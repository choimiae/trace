<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trace Demo SaaS</title>
    <style>
      body {
        margin: 40px;
        color: #17202a;
        font-family: system-ui, sans-serif;
      }

      button {
        margin-right: 8px;
        padding: 10px 14px;
      }

      .panel {
        max-width: 720px;
        border: 1px solid #d9e1ea;
        border-radius: 8px;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>설정</h1>
      <p>반복 클릭과 오류 감지를 확인하는 데모 화면입니다.</p>
      <button id="dead-click">권한 추가</button>
      <button onclick="window.trace?.track('report_export_clicked')">리포트 내보내기</button>
      <button onclick="throw new Error('Demo error')">오류 발생</button>
    </main>
    <script>
      // query string 에서 projectId 를 읽어야 하므로 정적 script 태그로는 속성을 채울 수 없다.
      // 동적으로 삽입한 classic script 도 실행 중에는 document.currentScript 가
      // 자기 요소를 가리키므로 data-* 파싱 경로가 동일하게 동작한다.
      const projectId = new URLSearchParams(window.location.search).get("projectId") ?? "proj_demo";
      const script = document.createElement("script");
      script.src = "http://localhost:4000/trace.js";
      script.dataset.projectId = projectId;
      document.head.appendChild(script);
    </script>
  </body>
</html>
